services:
  # 1. PostgreSQL 16 Relational Database Engine
  db:
    image: postgres:16-alpine
    container_name: medlens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medlens
      POSTGRES_USER: medlens_admin
      POSTGRES_PASSWORD: medlens_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlens_admin -d medlens"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medlens-net

  # 2. FastAPI Deterministic Verification Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medlens-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://medlens_admin:medlens_secure_password@db:5432/medlens
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - medlens-net

  # 3. Next.js 16 Web Dashboard & Scan Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medlens-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-your_firebase_api_key}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-medlens-8e318.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-medlens-8e318}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-medlens-8e318.firebasestorage.app}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-878014116991}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:878014116991:web:a69ac863884e1cda73bb4a}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medlens-net

volumes:
  postgres_data:
    driver: local

networks:
  medlens-net:
    driver: bridge

